name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build enhanced static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          tags = [
              '  <script src="./assets/sprint-7.js"></script>\n',
              '  <script src="./assets/visual-pass-2.js"></script>\n',
              '  <script src="./assets/visual-pass-3-atmosphere.js"></script>\n',
              '  <script src="./assets/visual-pass-3-depth.js"></script>\n',
              '  <script src="./assets/visual-pass-3-finale.js"></script>\n',
          ]
          for tag in tags:
              src = tag.split('src="', 1)[1].split('"', 1)[0]
              if src not in html:
                  html = html.replace('</body>', tag + '</body>')
          page.write_text(html, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
